name: Windows contracts
on:
  push:
    branches: [main, 'experimental/**', 'audit/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        windows: [windows-2022, windows-2025]
    runs-on: ${{ matrix.windows }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify available .NET SDK
        shell: pwsh
        run: dotnet --info
      - name: Run host-independent contracts and installer fixtures
        shell: pwsh
        run: ./Test-Windows.ps1
      - name: Report hardware and host test boundary
        if: always()
        shell: pwsh
        run: |
          Get-Content .test-results/summary.json -ErrorAction SilentlyContinue
          'GPU rendering and licensed Capture One integration require a separately reviewed test run.'
      - name: Attach host-independent contract receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-contracts-${{ matrix.windows }}
          path: .test-results/summary.json
          include-hidden-files: true
          if-no-files-found: ignore
